server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # redirects stay relative behind Cloudflare and the ingress
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api never reaches this server: the ingress routes it to the backend. Answer 404 instead of the app shell if a
    # request gets here anyway (a missing ingress rule), so the mistake shows up at once.
    location /api/ {
        return 404;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback. index.html must never be cached, otherwise clients keep asking for asset hashes that no longer
    # exist after a deploy.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
